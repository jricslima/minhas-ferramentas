<!DOCTYPE html>
<html lang="pt-br">
<head>
<link rel="icon" type="image/png" href="engrenagem.png">
    <meta charset="UTF-8">
    <title>Minhas Ferramentas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; padding: 40px; color: white; }
        h2 { text-align: center; margin-bottom: 30px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 20px; 
            max-width: 900px;
            margin: 0 auto;
        }
        .card { 
            background: #ffffff; padding: 20px; border-radius: 15px; 
            text-align: center; cursor: pointer; transition: 0.3s;
            color: #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card:hover { transform: scale(1.05); background: #ecf0f1; }
        .card img { width: 64px; height: 64px; margin-bottom: 10px; }
        .card div { font-weight: 600; font-size: 0.9em; }
    </style>
</head>
<body>

    <h2>Minhas Ferramentas</h2>
    <div class="grid">
        <div class="card" onclick="window.open('https://anydownloader.com/pt/')"><img src="anydownloader.png"><div>AnyDownloader</div></div>
        <div class="card" onclick="window.open('https://baixarfavicon.com.br/')"><img src="baixarfavicon.png"><div>BaixarFavicon</div></div>
        <div class="card" onclick="window.open('https://circlecropimage.com/pt')"><img src="circle-crop-imagem_cortada_circular.png"><div>Circle Crop</div></div>
        <div class="card" onclick="window.open('https://www.clipto.com/pt/')"><img src="cliptoai.png"><div>Clipto.AI</div></div>
        <div class="card" onclick="window.open('https://downsub.com/')"><img src="downsub.png"><div>DownSub</div></div>
        <div class="card" onclick="window.open('https://fdownloader.net/pt')"><img src="fdownloader.net.png"><div>FDownloader</div></div>
        <div class="card" onclick="window.open('https://www.fotoefeitos.com/')"><img src="fotoefeitos.png"><div>Foto Efeitos</div></div>
        <div class="card" onclick="window.open('https://www.fotor.com/')"><img src="fotor.png"><div>Fotor</div></div>
        <div class="card" onclick="window.open('https://www.iloveimg.com/pt')"><img src="iloveimg.png"><div>ILoveIMG</div></div>
        <div class="card" onclick="window.open('https://www.remove.bg/pt-br')"><img src="removebg.png"><div>Remove BG</div></div>
        <div class="card" onclick="window.open('https://savefrom.in.net/pt8/')"><img src="savefrom.png"><div>SaveFrom</div></div>
        <div class="card" onclick="window.open('https://steptodown.com/')"><img src="steptodown.png"><div>Steptodown</div></div>
        <div class="card" onclick="window.open('https://www.nikse.dk/subtitleedit/online')"><img src="subtitleditonline.png"><div>Subtitle Edit</div></div>
        <div class="card" onclick="window.open('https://turboscribe.ai/pt/')"><img src="turboscrib.png"><div>TurboScribe</div></div>
        <div class="card" onclick="window.open('https://upscayl.org/')"><img src="upscayl.png"><div>Upscayl</div></div>
        <div class="card" onclick="window.open('https://videotranscriber.ai/pt')"><img src="videotranscriber.png"><div>Video Transcriber</div></div>
        <div class="card" onclick="window.open('https://vidomon.com/')"><img src="vidomon.png"><div>Vidomon</div></div>
        <div class="card" onclick="window.open('https://y2meta.is/pt89/')"><img src="y2meta.png"><div>Y2meta</div></div>
    </div>

</body>
</html>
